<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{

  --chip:#DCE3F1; --chip-on:#1B2850; --chip-on-ink:#FFFFFF; --field:#FFFFFF;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10162B; --card:#1A2342; --ink:#E8ECF8; --ink-2:#A3AED0; --line:#33406B;
    --rule:#26315A; --margin:#F0788B; --mark:#8A6D10; --ok:#4FC28C; --learn:#F0836C;
    --chip:#222C52; --chip-on:#E8ECF8; --chip-on-ink:#10162B; --field:#141B36; --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#10162B; --card:#1A2342; --ink:#E8ECF8; --ink-2:#A3AED0; --line:#33406B;
  --rule:#26315A; --margin:#F0788B; --mark:#8A6D10; --ok:#4FC28C; --learn:#F0836C;
  --chip:#222C52; --chip-on:#E8ECF8; --chip-on-ink:#10162B; --field:#141B36; --shadow:0 18px 40px -18px rgba(0,0,0,.7);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 110px}
h1{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:clamp(1.4rem,4vw,1.8rem);margin:0 0 2px;letter-spacing:-.01em}
.sub{margin:0 0 16px;color:var(--ink-2);font-size:.95rem}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .3s}
.bar .k{background:var(--ok)} .bar .l{background:var(--learn)}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 14px;font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:.85rem;color:var(--ink-2)}
.stats b{color:var(--ink)}
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.glabel{font:500 .8rem "Bricolage Grotesque",Arial,sans-serif;color:var(--ink-2);min-width:44px}
.chip,.btn,select{font:500 .85rem "Bricolage Grotesque",Arial,sans-serif;border:0;border-radius:8px;background:var(--chip);color:var(--ink);padding:8px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.chip .n{opacity:.65;font-weight:400;margin-left:2px}
.btn.primary{background:var(--chip-on);color:var(--chip-on-ink)}
.btn.warn{background:var(--learn);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
.pos{font:italic 400 1rem "Source Serif 4",Georgia,serif;color:var(--ink-2)}
.scene{perspective:1400px;position:relative}
.card{display:grid;width:100%;min-height:340px;border:0;padding:0;background:none;cursor:pointer;text-align:left;font:inherit;color:inherit;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1);border-radius:10px}
.card.flipped{transform:rotateY(180deg)}
.face{position:relative;grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.face.back{transform:rotateY(180deg);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-position:0 52px}
.face::before{content:"";position:absolute;left:0;right:0;top:46px;height:2px;background:var(--margin)}
.top{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:500 .8rem "Bricolage Grotesque",Arial,sans-serif;color:var(--ink-2);background:var(--card)}
.top .left{display:flex;gap:12px;align-items:center}
.body{padding:46px 24px 66px;flex:1}
.front .body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-top:44px}
.word{font:700 clamp(2.2rem,9vw,3.6rem)/1.05 "Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.word.sm{font-size:clamp(1.8rem,7vw,2.4rem);text-align:left}
.hint{margin-top:18px;font:500 .8rem "Bricolage Grotesque",Arial,sans-serif;color:var(--ink-2)}
.star{color:var(--margin);font-weight:700}
.pri-tag{background:var(--chip-on);color:var(--chip-on-ink);border-radius:5px;padding:1px 8px;font-weight:700;letter-spacing:.01em}
.role{margin:0 0 12px;font:italic 400 .92rem "Source Serif 4",Georgia,serif;color:var(--ink-2)}
.sense{margin:0 0 14px}
.def{font-size:1.15rem;line-height:1.45;margin:0 0 6px;font-weight:600}
.def.big{font-size:1.35rem}
.ex{font-size:1.02rem;line-height:32px;margin:0;color:var(--ink);font-style:italic}
mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;font-style:normal;font-weight:600}
.eg,.rel{margin-top:8px;font-size:1rem;line-height:1.55;color:var(--ink)}
.rel{font-size:.92rem;color:var(--ink-2)}
.eg b,.rel b{font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:500}
.nav{display:flex;align-items:center;gap:10px;margin-top:18px}
.nav .grow{flex:1;text-align:center;font:500 .9rem "Bricolage Grotesque",Arial,sans-serif;color:var(--ink-2)}
.arrow{width:46px;height:46px;border-radius:50%;padding:0;font-size:1.2rem}
.mark{display:flex;gap:10px;margin-top:12px}
.mark button{flex:1;padding:14px;font-size:1rem;border-radius:10px;color:#fff;font-weight:700;border:0;cursor:pointer;font-family:"Bricolage Grotesque",Arial,sans-serif}
.mark .learn{background:var(--learn)} .mark .got{background:var(--ok)}
.mark button:disabled{opacity:.45;cursor:default}
.mine-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.keys{margin-top:18px;font-size:.82rem;color:var(--ink-2);text-align:center;line-height:1.6}
kbd{font:500 .78rem "Bricolage Grotesque",Arial,sans-serif;background:var(--chip);border-radius:5px;padding:1px 6px}
.empty{padding:50px 20px;text-align:center;color:var(--ink-2)}
.done{margin-top:12px;text-align:center;color:var(--ok);font:700 1rem "Bricolage Grotesque",Arial,sans-serif;min-height:1.4em}
.speak{position:absolute;left:12px;bottom:12px;width:46px;height:46px;border-radius:50%;border:0;padding:0;background:var(--chip-on);color:var(--chip-on-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 6px 16px -6px rgba(27,40,80,.6)}
.speak[hidden]{display:none}
.speak.on{background:var(--margin);color:#fff}
.status{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--line)}
.status.k{background:var(--ok)} .status.l{background:var(--learn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel[hidden],#scrim[hidden]{display:none}
#scrim{position:fixed;inset:0;background:rgba(10,15,35,.55);z-index:30}
#addPanel{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;z-index:31;border-radius:16px 16px 0 0;max-height:88%;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--chip-on);color:var(--chip-on-ink);font:500 2rem/1 "Bricolage Grotesque",Arial,sans-serif;cursor:pointer;z-index:20;box-shadow:0 10px 24px -8px rgba(27,40,80,.55);display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.panel h2{font:700 1.05rem "Bricolage Grotesque",Arial,sans-serif;margin:0 0 4px}
.panel p.note{margin:0 0 12px;font-size:.88rem;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font:500 .82rem "Bricolage Grotesque",Arial,sans-serif;color:var(--ink-2)}
.field input,.field textarea,.field select{font:400 1rem "Source Serif 4",Georgia,serif;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 160px;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--learn);font:500 .88rem "Bricolage Grotesque",Arial,sans-serif;min-height:1.2em}
@media (prefers-reduced-motion:reduce){.card{transition:none}.bar i{transition:none}}
@media (max-width:520px){.body{padding:46px 18px 66px}.row2{grid-template-columns:1fr}.glabel{min-width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Essential SAT Vocab</h1>
  <p class="sub" id="sub"></p>

  <div class="bar" aria-hidden="true"><i class="k" id="bk"></i><i class="l" id="bl"></i></div>
  <div class="stats" id="stats"></div>

  <div class="controls">
    <div class="group" role="group" aria-label="Choose a deck">
      <span class="glabel">Deck</span>
      <button class="chip" data-d="all" aria-pressed="true">All <span class="n"></span></button>
      <button class="chip" data-d="priority" aria-pressed="false">Priority <span class="n"></span></button>
      <button class="chip" data-d="word" aria-pressed="false">Words <span class="n"></span></button>
      <button class="chip" data-d="root" aria-pressed="false">Roots <span class="n"></span></button>
      <button class="chip" data-d="prefix" aria-pressed="false">Prefixes <span class="n"></span></button>
      <button class="chip" data-d="suffix" aria-pressed="false">Suffixes <span class="n"></span></button>
      <button class="chip" data-d="mine" aria-pressed="false">My words <span class="n"></span></button>
    </div>
    <div class="group" role="group" aria-label="Filter by progress">
      <span class="glabel">Show</span>
      <button class="chip" data-f="all" aria-pressed="true">Everything</button>
      <button class="chip" data-f="new" aria-pressed="false">Not yet seen</button>
      <button class="chip" data-f="l" aria-pressed="false">Still learning</button>
      <button class="chip" data-f="k" aria-pressed="false">Got it</button>
      <button class="chip" data-f="star" aria-pressed="false">★ Tricky meanings</button>
    </div>
    <div class="group">
      <button class="btn" id="mode">Showing: word first</button>
      <button class="btn" id="shuffle" aria-pressed="false">Shuffle: off</button>
      <select id="letter" aria-label="Jump to letter"></select>
    </div>
  </div>

  <div id="scrim" hidden></div>
  <button class="fab" id="addBtn" aria-label="Add a word" title="Add a word">+</button>

  <div class="panel" id="addPanel" role="dialog" aria-modal="true" aria-labelledby="addTitle" hidden>
    <h2 id="addTitle">Add a word</h2>
    <p class="note">Your words are saved in this browser only, so they stay on this device and aren't shared with anyone who opens the link.</p>
    <div class="row2">
      <div class="field"><label for="f_word">Word or term</label><input id="f_word" type="text" maxlength="80" autocomplete="off"></div>
      <div class="field"><label for="f_pos">Part of speech</label>
        <select id="f_pos"><option value="">Not set</option><option value="n">noun</option><option value="v">verb</option><option value="adj">adjective</option><option value="adv">adverb</option><option value="other">other</option></select></div>
    </div>
    <div class="field"><label for="f_def">Definition</label><textarea id="f_def" maxlength="500"></textarea></div>
    <div class="field"><label for="f_ex">Example sentence (optional)</label><textarea id="f_ex" maxlength="500"></textarea></div>
    <div class="field"><label for="f_rel">Related words or notes (optional)</label><input id="f_rel" type="text" maxlength="200" autocomplete="off"></div>
    <div class="err" id="addErr" role="alert"></div>
    <div class="actions">
      <button class="btn primary" id="saveWord">Save word</button>
      <button class="btn" id="saveAnother">Save and add another</button>
      <button class="btn" id="cancelAdd">Cancel</button>
    </div>
  </div>

  <div class="scene">
    <button class="card" id="card" aria-live="polite" aria-label="Flashcard. Press to flip."></button>
    <button class="speak" id="speak" aria-label="Hear the pronunciation" title="Hear it (P)" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>

  <div class="nav">
    <button class="btn arrow" id="prev" aria-label="Previous card">←</button>
    <div class="grow" id="pos"></div>
    <button class="btn arrow" id="next" aria-label="Next card">→</button>
  </div>
  <div class="mark">
    <button class="learn" id="bl2">Still learning</button>
    <button class="got" id="bg2">Got it</button>
  </div>
  <div class="mine-actions" id="mineActions" hidden>
    <button class="btn" id="editBtn">Edit this word</button>
    <button class="btn" id="delBtn">Delete this word</button>
  </div>
  <div class="done" id="done" role="status"></div>
  <div class="keys"><kbd>Space</kbd> flip &nbsp; <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp; <kbd>L</kbd> still learning &nbsp; <kbd>G</kbd> got it &nbsp; <kbd>P</kbd> hear it</div>
</div>

word|Regulate|v|To control something through rules or adjustments.|The government regulates the safety of medicines.|||0
word|Innovate|v|To introduce new ideas, methods, or products.|The engineers continued to innovate rather than rely on older designs.|innovation (n): a new idea or method; innovative (adj): introducing new ideas||0
word|Sufficient|adj|Enough for a particular purpose.|There was sufficient evidence to continue the investigation.|suffice (v): to be enough||0
word|Austere|adj|Plain and strict, without comfort or luxury.|The monastery’s rooms were austere, with only a bed and a wooden table.|Similar: spartan, stark||0
word|Skeptically|adv|In a way that shows doubt or disbelief.|She looked skeptically at the extraordinary claim.|skeptical (adj): doubtful; skepticism (n): doubt||0
word|Satiate|v|To completely satisfy a desire or appetite.|The large meal was enough to satiate his hunger.|||0
word|Interplay|n|The way two or more things affect each other.|The disease results from a complex interplay between genes and environment.|||0
word|Throughput|n|The amount of work, material, or data processed in a given time.|The new equipment increased the factory’s throughput.|||0
word|Abstain|v|To choose not to do or take part in something.|Three members abstained from voting on the proposal.|||0
word|Incipient|adj|Just beginning to develop or appear.|The doctor detected signs of an incipient infection.|||0
word|Deviate|v|To move away from an expected path, rule, or standard.|The plane deviated from its planned route because of the storm.|deviant (adj): departing from what is normal; deviation (n): the act of departing from a standard||0
word|Ambivalent|adj|Having mixed or conflicting feelings.|He remained ambivalent about the proposal, seeing both benefits and risks.|ambivalence (n): the state of being ambivalent||0
word|Ambiguous|adj|Unclear because it can have more than one meaning.|His ambiguous answer made it difficult to tell what he really believed.|||0
word|Attenuate|v|To weaken or reduce in strength.|The signal became attenuated as it traveled farther from the transmitter.|||0
word|Impede|v|To block, slow down, or make more difficult.|Heavy traffic impeded the ambulance’s progress.|impediment (n): an obstacle||0
prefix|ambi, amphi|prefix|Both; two.||Memory hook: the “bi” in bicycle means two. Ambidextrous means able to use both hands equally, so you’re neither a lefty nor a righty.|ambidextrous, ambiguous, ambivalent|0`;

const POSNAME={v:"verb",n:"noun",adj:"adjective",adv:"adverb",other:"other"};
const KINDLABEL={word:"word",root:"root",prefix:"prefix",suffix:"suffix",mine:"my word"};
const KEY="sat-vocab-flashcards-v1", CKEY="sat-vocab-custom-v1";

/* ---------- build the card set ---------- */
const ROLE={root:"A root carries the core meaning at the heart of a word.",prefix:"A prefix attaches to the front of a word and changes its meaning.",suffix:"A suffix attaches to the end of a word and changes its meaning or its part of speech."};
function fmtTerm(kind,term){
  if(kind==="word"||kind==="mine") return term;
  const m=term.match(/^(.*?)(\s*\(.*\))?$/), core=m[1], par=m[2]||"";
  return core.split(/\s*,\s*/).map(p=>kind==="prefix"?p+"-":kind==="suffix"?"-"+p:p).join(", ")+par;
}
const BASE=[];
RAW_PRI.trim().split("\n").forEach((ln,i)=>{
  const [kind,term,pos,def,ex,rel,eg,star]=ln.split("|");
  BASE.push({id:"p"+i,kind,term,key:term,word:fmtTerm(kind,term),labels:pos.split("§").map(p=>POSNAME[p]||p),def:def.split("§"),ex:ex?ex.split("§"):[],rel,eg,star:star==="1",pri:true});
});
RAW_WORDS.trim().split("\n").forEach(ln=>{
  const [id,word,pos,def,ex,rel,star]=ln.split("|");
  BASE.push({id,kind:"word",term:word,key:word,word,labels:pos.split("§").map(p=>POSNAME[p]||p),def:def.split("§"),ex:ex.split("§"),rel,eg:"",star:star==="1",pri:false});
});
RAW_ROOTS.trim().split("\n").forEach(ln=>{
  const [id,kind,term,label,meaning,eg]=ln.split("|");
  BASE.push({id:"a"+id,kind,term,key:term,word:fmtTerm(kind,term),labels:[label],def:[meaning],ex:[],rel:"",eg,star:false,pri:false});
});

let status={}, custom=[], deck="all", filter="all", mode="word", shuffled=false, order=[], idx=0, flipped=false, editingId=null;
try{ const s=JSON.parse(localStorage.getItem(KEY)||"{}"); status=s.status||{}; mode=s.mode||"word"; shuffled=!!s.shuffled; }catch(e){}
try{ const c=JSON.parse(localStorage.getItem(CKEY)||"[]"); if(Array.isArray(c)) custom=c.filter(x=>x&&typeof x.word==="string"&&typeof x.def==="string"); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({status,mode,shuffled})); }catch(e){} }
function saveCustom(){ try{ localStorage.setItem(CKEY,JSON.stringify(custom)); }catch(e){} }

let CARDS=[], BYID={};
function rebuildCards(){
  const mine=custom.map(c=>({id:c.id,kind:"mine",term:c.word,key:c.word,pri:false,word:c.word,labels:c.pos?[POSNAME[c.pos]||c.pos]:[],def:[c.def],ex:c.ex?[c.ex]:[],rel:c.rel||"",eg:"",star:false}));
  CARDS=BASE.concat(mine); BYID={}; CARDS.forEach(c=>BYID[c.id]=c);
}
rebuildCards();

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function hl(ex,word){
  const stem=reEsc(word.slice(0,Math.max(4,word.length-3)));
  try{ return esc(ex).replace(new RegExp("\\b("+stem+"\\w*)","gi"),"<mark>$1</mark>"); }catch(e){ return esc(ex); }
}
function hlEg(w){
  const variants=(w.term||w.word).replace(/\s*\(.*?\)/g,"").split(/[,\/]/).map(s=>s.trim().toLowerCase())
    .filter(v=>v.length>=(w.kind==="prefix"?1:2)).sort((a,b)=>b.length-a.length).map(reEsc);
  const txt=esc(w.eg);
  if(!variants.length) return txt;
  const alt=variants.join("|");
  const re = w.kind==="prefix" ? new RegExp("\\b("+alt+")","gi")
           : w.kind==="suffix" ? new RegExp("("+alt+")\\b","gi")
           : new RegExp("("+alt+")","gi");
  return txt.replace(re,"<mark>$1</mark>");
}
function shuf(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const inDeck=c=>deck==="all"||(deck==="priority"?c.pri:c.kind===deck);

/* ---------- deck building ---------- */
function build(keepId){
  let list=CARDS.filter(c=>{
    if(!inDeck(c)) return false;
    const s=status[c.id];
    if(filter==="new") return !s;
    if(filter==="l") return s==="l";
    if(filter==="k") return s==="k";
    if(filter==="star") return c.star;
    return true;
  }).map(c=>c.id);
  if(shuffled){ const P=shuf(list.filter(id=>BYID[id].pri)), R=shuf(list.filter(id=>!BYID[id].pri)); list=P.concat(R); }
  order=list;
  idx = keepId!=null && order.includes(keepId) ? order.indexOf(keepId) : 0;
  flipped=false;
  updateLetters();
  render();
}
function updateLetters(){
  const sel=$("letter");
  const letters=[...new Set(CARDS.filter(inDeck).map(c=>c.key[0].toUpperCase()))].sort();
  sel.innerHTML='<option value="">Jump to…</option>'+letters.map(L=>`<option>${esc(L)}</option>`).join("");
}

/* ---------- rendering ---------- */
function labelTxt(w){ return w.labels.map(esc).join(" / "); }
function sensesHTML(w,withDef){
  return w.def.map((d,i)=>{
    const lab=w.labels[i]||w.labels[0]||"";
    const tag=w.def.length>1?`<span class="pos">${i+1}. ${esc(lab)}</span><br>`:"";
    const ex=w.ex[i]||w.ex[0]||"";
    return `<div class="sense">${tag}${withDef?`<p class="def">${esc(d)}</p>`:""}${ex?`<p class="ex">${hl(ex,w.word)}</p>`:""}</div>`;
  }).join("");
}
function extraHTML(w){
  return (w.eg?`<div class="eg"><b>Words that use it:</b> ${hlEg(w)}</div>`:"")+(w.rel?(/^(Memory hook|Similar):/.test(w.rel)?`<div class="rel"><b>${esc(w.rel.split(":")[0])}:</b>${esc(w.rel.slice(w.rel.indexOf(":")+1))}</div>`:`<div class="rel"><b>Related:</b> ${esc(w.rel)}</div>`):"");
}

function render(){
  const inD=CARDS.filter(inDeck);
  const k=inD.filter(c=>status[c.id]==="k").length, l=inD.filter(c=>status[c.id]==="l").length, total=inD.length||1;
  $("bk").style.width=(k/total*100)+"%"; $("bl").style.width=(l/total*100)+"%";
  $("stats").innerHTML=`<span><b>${k}</b> got it</span><span><b>${l}</b> still learning</span><span><b>${inD.length-k-l}</b> not yet seen</span>`;
  const counts={all:CARDS.length,priority:CARDS.filter(c=>c.pri).length}; CARDS.forEach(c=>counts[c.kind]=(counts[c.kind]||0)+1);
  document.querySelectorAll("[data-d]").forEach(b=>{ b.setAttribute("aria-pressed",b.dataset.d===deck); b.querySelector(".n").textContent=counts[b.dataset.d]||0; });
  document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filter));
  const rest=CARDS.filter(c=>!c.pri), nW=rest.filter(c=>c.kind==="word").length, nA=rest.filter(c=>["root","prefix","suffix"].includes(c.kind)).length, nM=counts.mine||0;
  $("sub").textContent=`${counts.priority} priority cards shown first, then ${nW} vocabulary words and ${nA} roots and word parts${nM?`, plus ${nM} of your own`:""}. Vocab list from Ivy League Mentors; word roots from Ivy Global.`;

  $("mode").textContent="Showing: "+(mode==="word"?"word first":"definition first");
  $("shuffle").textContent="Shuffle: "+(shuffled?"on":"off");
  $("shuffle").setAttribute("aria-pressed",shuffled);

  const card=$("card"), has=order.length>0;
  $("prev").disabled=$("next").disabled=$("bl2").disabled=$("bg2").disabled=!has;
  if(!has){
    card.className="card";
    card.setAttribute("aria-label","No cards in this deck");
    card.innerHTML=`<div class="face front"><div class="top"><span></span></div><div class="body empty">${deck==="mine"&&!custom.length?"You haven't added any words yet.<br>Select the + button at the bottom of the page to make your first card.":"No cards match these filters.<br>Try a different deck or progress filter."}</div></div>`;
    $("pos").textContent="0 / 0"; $("done").textContent=""; $("mineActions").hidden=true; updateSpeak(); return;
  }
  const w=BYID[order[idx]], s=status[w.id];
  $("pos").textContent=`${idx+1} / ${order.length}`;
  $("mineActions").hidden=w.kind!=="mine";

  const left=`<span class="left"><span>${KINDLABEL[w.kind]}</span>${w.pri?`<span class="pri-tag">priority</span>`:""}${w.star?`<span class="star">★ tricky meaning</span>`:""}</span>`;
  const dot=`<span><span class="status ${s||""}"></span>${s==="k"?"Got it":s==="l"?"Still learning":"New"}</span>`;
  const lab=w.labels.length?`<div class="pos">${labelTxt(w)}</div>`:"";
  const askKind={word:"word",root:"root",prefix:"prefix",suffix:"suffix",mine:"word"}[w.kind];

  let front, back;
  if(mode==="word"){
    front=`<div class="body"><h2 class="word">${esc(w.word)}</h2>${lab}<div class="hint">Tap to flip</div></div>`;
    back=`<div class="body">${w.def.length===1&&w.labels.length?`<p class="pos" style="margin:0 0 6px">${labelTxt(w)}</p>`:""}${ROLE[w.kind]?`<p class="role">${ROLE[w.kind]}</p>`:""}${sensesHTML(w,true)}${extraHTML(w)}</div>`;
  } else {
    front=`<div class="body"><p class="def big">${w.def.map(esc).join("<br><br>")}</p><div class="hint">Which ${askKind} is this? Tap to flip</div></div>`;
    back=`<div class="body"><h2 class="word sm">${esc(w.word)}</h2><div style="margin:2px 0 6px">${lab}</div>${ROLE[w.kind]?`<p class="role">${ROLE[w.kind]}</p>`:""}${sensesHTML(w,false)}${extraHTML(w)}</div>`;
  }
  card.className="card"+(flipped?" flipped":"");
  card.setAttribute("aria-label",`Flashcard ${idx+1} of ${order.length}. Press to flip.`);
  card.innerHTML=`<div class="face front"><div class="top">${left}${dot}</div>${front}</div><div class="face back"><div class="top">${left}${dot}</div>${back}</div>`;
  $("done").textContent=order.every(id=>status[id]==="k")?"Every card in this view is marked Got it.":"";
  updateSpeak();
}

/* ---------- pronunciation ---------- */
// Optional human recordings, keyed by lowercase term: {"veneration":"data:audio/mpeg;base64,..."}.
// A card with a recording plays it; every other card uses the browser's built-in voice.
const AUDIO={};
const canSpeak=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
let voice=null;
function pickVoice(){
  if(!canSpeak) return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const pref=[/natural|neural|premium|enhanced/i,/google us english|samantha|aria|jenny|ava|allison|zira/i,/en[-_]US/i];
  voice=null;
  for(const re of pref){ voice=vs.find(v=>re.test(v.name)||re.test(v.lang)); if(voice) break; }
  if(!voice) voice=vs[0]||null;
}
if(canSpeak){ pickVoice(); try{ speechSynthesis.addEventListener("voiceschanged",pickVoice); }catch(e){} }
function speakText(w){ return (w.kind==="root"||w.kind==="prefix"||w.kind==="suffix") ? w.eg : (w.term||w.word); }
function updateSpeak(){
  const w=order.length?BYID[order[idx]]:null;
  const hide=!w||(!canSpeak&&!AUDIO[(w.term||w.word).toLowerCase()])||flipped;
  const b=$("speak"); b.hidden=hide;
  if(w) b.setAttribute("aria-label",["root","prefix","suffix"].includes(w.kind)?"Hear the example words":"Hear the pronunciation");
}
function playCurrent(){
  if(!order.length||$("speak").hidden) return;
  const w=BYID[order[idx]], b=$("speak"), clip=AUDIO[(w.term||w.word).toLowerCase()];
  const done=()=>b.classList.remove("on");
  b.classList.add("on");
  try{
    if(clip){ const a=new Audio(clip); a.onended=done; a.onerror=done; a.play().catch(done); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(speakText(w));
    u.lang=voice?voice.lang:"en-US"; if(voice) u.voice=voice; u.rate=.85;
    u.onend=done; u.onerror=done; speechSynthesis.speak(u);
  }catch(e){ done(); }
}

/* ---------- actions ---------- */
function flip(){ if(!order.length) return; flipped=!flipped; $("card").classList.toggle("flipped",flipped); updateSpeak(); }
function go(d){ if(canSpeak) try{ speechSynthesis.cancel(); }catch(e){} $("speak").classList.remove("on"); if(!order.length) return; idx=(idx+d+order.length)%order.length; flipped=false; render(); }
function mark(v){
  if(!order.length) return;
  status[order[idx]]=v; save();
  if(filter==="new"||filter==="l"||filter==="k"){
    const p=idx; order.splice(idx,1);
    if(!order.length){ render(); return; }
    idx=Math.min(p,order.length-1); flipped=false; render();
  } else go(1);
}
function armConfirm(btn,label,doIt){
  if(btn.dataset.armed){ clearTimeout(+btn.dataset.t); btn.textContent=btn.dataset.orig; delete btn.dataset.armed; doIt(); return; }
  btn.dataset.orig=btn.textContent; btn.dataset.armed="1"; btn.textContent=label;
  btn.dataset.t=setTimeout(()=>{ btn.textContent=btn.dataset.orig; delete btn.dataset.armed; },3500);
}

$("card").addEventListener("click",flip);
$("speak").onclick=playCurrent;
$("prev").onclick=()=>go(-1); $("next").onclick=()=>go(1);
$("bl2").onclick=()=>mark("l"); $("bg2").onclick=()=>mark("k");
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{deck=b.dataset.d; build();});
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f; build();});
$("mode").onclick=()=>{mode=mode==="word"?"def":"word"; save(); flipped=false; render();};
$("shuffle").onclick=()=>{shuffled=!shuffled; save(); build(order[idx]);};
$("letter").onchange=()=>{
  const v=$("letter").value; if(!v) return;
  filter="all"; shuffled=false; save(); build();
  const t=CARDS.filter(inDeck).find(c=>c.key[0].toUpperCase()===v);
  if(t){ idx=order.indexOf(t.id); render(); }
  $("letter").value="";
};

/* ---------- add / edit custom words ---------- */
function openAdd(id){
  editingId=id||null;
  const c=id?custom.find(x=>x.id===id):null;
  $("addTitle").textContent=c?"Edit word":"Add a word";
  $("f_word").value=c?c.word:""; $("f_pos").value=c?(c.pos||""):""; $("f_def").value=c?c.def:"";
  $("f_ex").value=c?(c.ex||""):""; $("f_rel").value=c?(c.rel||""):"";
  $("addErr").textContent=""; $("saveAnother").hidden=!!c;
  $("addPanel").hidden=false; $("scrim").hidden=false; $("addBtn").hidden=true;
  $("addPanel").scrollTop=0; $("f_word").focus();
}
function closeAdd(){ $("addPanel").hidden=true; $("scrim").hidden=true; $("addBtn").hidden=false; editingId=null; }
function saveWord(another){
  const word=$("f_word").value.trim(), def=$("f_def").value.trim();
  if(!word){ $("addErr").textContent="Enter the word or term."; $("f_word").focus(); return; }
  if(!def){ $("addErr").textContent="Enter a definition."; $("f_def").focus(); return; }
  const rec={word,pos:$("f_pos").value,def,ex:$("f_ex").value.trim(),rel:$("f_rel").value.trim()};
  let id;
  if(editingId){ const c=custom.find(x=>x.id===editingId); Object.assign(c,rec); id=editingId; }
  else { id="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); custom.push({id,...rec}); }
  saveCustom(); rebuildCards();
  deck="mine"; filter="all"; shuffled=false; save(); build(id);
  if(another && !editingId){ openAdd(); $("addErr").textContent=`Saved “${word}”. Add the next one.`; }
  else { closeAdd(); }
}
$("addBtn").onclick=()=>openAdd();
$("saveWord").onclick=()=>saveWord(false);
$("saveAnother").onclick=()=>saveWord(true);
$("cancelAdd").onclick=closeAdd;
$("scrim").onclick=closeAdd;
$("editBtn").onclick=()=>{ const w=BYID[order[idx]]; if(w&&w.kind==="mine") openAdd(w.id); };
$("delBtn").onclick=()=>armConfirm($("delBtn"),"Select again to delete",()=>{
  const w=BYID[order[idx]]; if(!w||w.kind!=="mine") return;
  custom=custom.filter(c=>c.id!==w.id); delete status[w.id]; saveCustom(); save(); rebuildCards();
  const p=idx; build(); idx=Math.min(p,Math.max(order.length-1,0)); render();
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("addPanel").hidden){ closeAdd(); return; }
  const t=e.target.tagName;
  if(t==="SELECT"||t==="INPUT"||t==="TEXTAREA") return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key===" "||e.key==="Enter"){ if(t==="BUTTON"&&e.target.id!=="card") return; e.preventDefault(); flip(); }
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="l"||e.key==="L") mark("l");
  else if(e.key==="g"||e.key==="G") mark("k");
  else if(e.key==="p"||e.key==="P") playCurrent();
});

build();
</script>
</body>
</html>
