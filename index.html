const WORDS = RAW.trim().split("\n").map((ln,i)=>{
  const [word,pos,def,ex,rel,star]=ln.split("|");
  return {id:i,word,pos:pos.split("§"),def:def.split("§"),ex:ex.split("§"),rel,star:star==="1"};
});
const POSNAME={v:"verb",n:"noun",adj:"adjective",adv:"adverb"};
const KEY="sat-vocab-flashcards-v1";
let status={}, filter="all", mode="word", shuffled=false, order=[], idx=0, flipped=false;

try{ const s=JSON.parse(localStorage.getItem(KEY)||"{}"); status=s.status||{}; mode=s.mode||"word"; shuffled=!!s.shuffled; }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({status,mode,shuffled})); }catch(e){} }

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(ex,word){
  const stem=word.slice(0,Math.max(4,word.length-3)).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const re=new RegExp("\\b("+stem+"\\w*)","gi");
  return esc(ex).replace(re,"<mark>$1</mark>");
}
function shuf(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function build(keepId){
  let list=WORDS.filter(w=>{
    const s=status[w.id];
    if(filter==="new") return !s;
    if(filter==="l") return s==="l";
    if(filter==="k") return s==="k";
    if(filter==="star") return w.star;
    return true;
  }).map(w=>w.id);
  if(shuffled) shuf(list);
  order=list;
  idx = keepId!=null && order.includes(keepId) ? order.indexOf(keepId) : 0;
  flipped=false;
  render();
}

function posLabel(p){ return POSNAME[p]||p; }

function render(){
  const total=WORDS.length;
  const k=Object.values(status).filter(v=>v==="k").length;
  const l=Object.values(status).filter(v=>v==="l").length;
  $("bk").style.width=(k/total*100)+"%"; $("bl").style.width=(l/total*100)+"%";
  $("stats").innerHTML=`<span><b>${k}</b> got it</span><span><b>${l}</b> still learning</span><span><b>${total-k-l}</b> not yet seen</span>`;

  $("mode").textContent="Showing: "+(mode==="word"?"word first":"definition first");
  $("shuffle").textContent="Shuffle: "+(shuffled?"on":"off");
  $("shuffle").setAttribute("aria-pressed",shuffled);
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===filter));

  const card=$("card");
  const has=order.length>0;
  $("prev").disabled=$("next").disabled=$("bl2").disabled=$("bg2").disabled=!has;
  if(!has){
    card.className="card"; 
    card.innerHTML=`<div class="face front"><div class="top"><span></span></div><div class="body empty">No cards in this deck yet.<br>Pick another filter above.</div></div>`;
    $("pos").textContent="0 / 0"; $("done").textContent=""; return;
  }
  const w=WORDS[order[idx]];
  const s=status[w.id];
  $("pos").innerHTML=`${idx+1} / ${order.length}`;

  const posTxt=w.pos.map(posLabel).join(" / ");
  const star=w.star?`<span class="star">★ tricky meaning</span>`:`<span></span>`;
  const dot=`<span><span class="status ${s||""}"></span>${s==="k"?"Got it":s==="l"?"Still learning":"New"}</span>`;

  const wordSide=`<div class="body"><h2 class="word">${esc(w.word)}</h2><div class="pos">${posTxt}</div><div class="hint">Tap to flip</div></div>`;
  const senses=w.def.map((d,i)=>{
    const p=w.pos[i]||w.pos[0];
    const tag=w.def.length>1?`<span class="pos">${i+1}. ${posLabel(p)}</span><br>`:"";
    return `<div class="sense">${tag}<p class="def">${esc(d)}</p><p class="ex">${hl(w.ex[i]||w.ex[0],w.word)}</p></div>`;
  }).join("");
  const rel=w.rel?`<div class="rel"><b>Related:</b> ${esc(w.rel)}</div>`:"";
  const defSide=`<div class="body">${w.def.length===1?`<p class="pos" style="margin:0 0 6px">${posTxt}</p>`:""}${senses}${rel}</div>`;

  const frontBody = mode==="word"
    ? wordSide
    : `<div class="body"><p class="def" style="font-size:1.35rem">${w.def.map(esc).join("<br><br>")}</p><div class="hint">What word is this? Tap to flip</div></div>`;
  const backBody = mode==="word"
    ? `<div class="body" style="padding-top:46px">${defSide.replace('<div class="body">','').replace(/<\/div>$/,'')}</div>`
    : `<div class="body" style="padding-top:46px"><h2 class="word" style="text-align:left;font-size:2.2rem">${esc(w.word)}</h2><div class="pos" style="margin-bottom:12px">${posTxt}</div>${senses.replace(/<p class="def">.*?<\/p>/g,"")}${rel}</div>`;

  card.className="card"+(flipped?" flipped":"");
  card.setAttribute("aria-label",`Flashcard ${idx+1} of ${order.length}. ${mode==="word"?w.word:"definition"}. Press to flip.`);
  card.innerHTML=
   `<div class="face front"><div class="top">${star}${dot}</div>${frontBody.replace('class="body"', 'class="body" style="padding-top:44px"')}</div>`+
   `<div class="face back"><div class="top">${star}${dot}</div>${backBody}</div>`;
  $("done").textContent = (order.length && order.every(id=>status[id]==="k")) ? "Every card in this deck is marked Got it." : "";
}

function flip(){ if(!order.length) return; flipped=!flipped; $("card").classList.toggle("flipped",flipped); }
function go(d){
  if(!order.length) return;
  idx=(idx+d+order.length)%order.length; flipped=false; render();
}
function mark(v){
  if(!order.length) return;
  const id=order[idx];
  status[id]=v; save();
  // If the active filter would now drop this card, rebuild deck keeping position.
  if(filter==="new"||filter==="l"||filter==="k"){
    const pos=idx; order.splice(idx,1);
    if(!order.length){ render(); return; }
    idx=Math.min(pos,order.length-1); flipped=false; render();
  } else { go(1); }
}

$("card").addEventListener("click",flip);
$("prev").onclick=()=>go(-1); $("next").onclick=()=>go(1);
$("bl2").onclick=()=>mark("l"); $("bg2").onclick=()=>mark("k");
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filter=c.dataset.f; build();});
$("mode").onclick=()=>{mode=mode==="word"?"def":"word"; save(); flipped=false; render();};
$("shuffle").onclick=()=>{shuffled=!shuffled; save(); build(order[idx]);};
$("reset").onclick=()=>{ if(confirm("Clear your Got it / Still learning marks?")){status={}; save(); build();} };

const sel=$("letter");
sel.innerHTML='<option value="">Jump to…</option>'+[...new Set(WORDS.map(w=>w.word[0].toUpperCase()))].map(L=>`<option>${L}</option>`).join("");
sel.onchange=()=>{
  if(!sel.value) return;
  filter="all"; shuffled=false; save(); build();
  const t=WORDS.find(w=>w.word[0].toUpperCase()===sel.value);
  idx=order.indexOf(t.id); render(); sel.value="";
};

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT") return;
  if(e.key===" "||e.key==="Enter"){ if(e.target.tagName==="BUTTON"&&e.target.id!=="card") return; e.preventDefault(); flip(); }
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="l"||e.key==="L") mark("l");
  else if(e.key==="g"||e.key==="G") mark("k");
});

build();
</script>
</body>
</html>
